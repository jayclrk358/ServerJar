# Builds ready-to-run server binaries and publishes them as a GitHub Release.
# Push a tag like v0.1.0 to make a release, or run it by hand from the Actions tab
# (a manual run only produces downloadable artifacts, no release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ViaProxy plugin that forwards real player identities to Pumpkin (see via/README.md).
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build PumpkinForward.jar
        run: ./via/plugin/build.sh

      - name: Check the forwarding packet against Pumpkin's format
        run: |
          javac -proc:none --release 17 -cp via/plugin/build/ViaProxy-*.jar:via/plugin/build/classes \
            -d via/plugin/build/test-classes via/plugin/src/test/java/serverjar/pumpkinforward/EncodeDump.java
          java -cp via/plugin/build/ViaProxy-*.jar:via/plugin/build/classes:via/plugin/build/test-classes \
            serverjar.pumpkinforward.EncodeDump | python3 via/plugin/src/test/check.py

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: via/plugin/build/PumpkinForward.jar
          if-no-files-found: error

  build:
    needs: plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc (2.35) keeps the binary compatible with Ubuntu 22.04+ and Debian 12+.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: via

      # x86-64-v3 (AVX2, ~2015+ CPUs) is fast and runs on practically every server CPU.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./build.sh --cpu x86-64-v3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Cpu x86-64-v3

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist bundle/ServerJar
          cp server/pumpkin "dist/pumpkin-${{ matrix.name }}"
          cp server/pumpkin server/pumpkin.toml server/start.sh server/pumpkin.service bundle/ServerJar/
          mkdir -p bundle/ServerJar/via
          cp via/setup.sh via/start-via.sh via/viaproxy.yml via/viaproxy.env via/viaproxy.service \
             via/patch-pumpkin-toml.py via/README.md via/PumpkinForward.jar bundle/ServerJar/via/
          chmod +x bundle/ServerJar/pumpkin bundle/ServerJar/start.sh bundle/ServerJar/via/setup.sh bundle/ServerJar/via/start-via.sh
          tar -C bundle -czf "dist/ServerJar-${{ matrix.name }}.tar.gz" ServerJar

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, bundle/ServerJar | Out-Null
          Copy-Item server/pumpkin.exe "dist/pumpkin-${{ matrix.name }}.exe"
          Copy-Item server/pumpkin.exe, server/pumpkin.toml, server/start.bat bundle/ServerJar/
          New-Item -ItemType Directory -Force bundle/ServerJar/via | Out-Null
          Copy-Item via/setup.ps1, via/start-via.bat, via/viaproxy.yml, via/viaproxy.env, via/README.md, via/PumpkinForward.jar bundle/ServerJar/via/
          Compress-Archive -Path bundle/ServerJar -DestinationPath "dist/ServerJar-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # the plugin artifact is one file, so it lands as dist/PumpkinForward.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          commit=$(grep -oP "PUMPKIN_COMMIT:-\K[0-9a-f]+" build.sh)
          mc=$(grep -oP 'MC_VERSION:-\K[0-9.]+' build.sh)
          patches=$(ls patches/*.patch | xargs -n1 basename | sed 's/^/- /')
          cat > notes.md <<EOF
          Ready-to-run server for **Minecraft Java $mc**. No Java or build tools needed.

          | File | For |
          |---|---|
          | \`pumpkin-linux-x86_64\` | Linux x86-64 (Ubuntu 22.04+, Debian 12+). Just the server binary. |
          | \`ServerJar-linux-x86_64.tar.gz\` | Linux: binary + tuned \`pumpkin.toml\` + \`start.sh\` + systemd unit. |
          | \`pumpkin-windows-x86_64.exe\` | Windows x86-64. Just the server binary. |
          | \`ServerJar-windows-x86_64.zip\` | Windows: exe + tuned \`pumpkin.toml\` + \`start.bat\`. |
          | \`PumpkinForward.jar\` | ViaProxy plugin for multi-version support (1.7.2–26.3 clients). Also inside both bundles under \`via/\`; run \`via/setup.sh\` or \`via\\setup.ps1\`. |

          Built for x86-64-v3 CPUs (AVX2, roughly 2015 or newer).
          Pumpkin commit \`$commit\` with these patches:
          $patches
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
