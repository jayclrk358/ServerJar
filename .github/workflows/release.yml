# Builds ready-to-run server binaries and publishes them as a GitHub Release.
# Push a tag like v0.1.0 to make a release, or run it by hand from the Actions tab
# (a manual run only produces downloadable artifacts, no release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Creates the release with its notes; the build jobs attach the server downloads as they finish.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(grep -oP "PUMPKIN_COMMIT:-\K[0-9a-f]+" build.sh)
          mc=$(grep -oP 'MC_VERSION:-\K[0-9.]+' build.sh)
          patches=$(ls patches/*.patch | xargs -n1 basename | sed 's/^/- /')
          cat > notes.md <<EOF
          Ready-to-run server for **Minecraft Java $mc**. No Java or build tools needed.

          | File | For |
          |---|---|
          | \`pumpkin-linux-x86_64\` | Linux x86-64 (Ubuntu 22.04+, Debian 12+). Just the server binary. |
          | \`Mineversed-linux-x86_64.tar.gz\` | Linux: binary + tuned \`pumpkin.toml\` + \`start.sh\` + systemd unit + web panel. |
          | \`pumpkin-windows-x86_64.exe\` | Windows x86-64. Just the server binary. |
          | \`Mineversed-windows-x86_64.zip\` | Windows: exe + tuned \`pumpkin.toml\` + \`start.bat\`. |
          | Multiversion | The plugin that lets 1.21+ clients join lives in its own repository: https://github.com/jayclrk358/Multiversion. The VPS installer downloads it from there. |
          | perfmon | The performance and debug plugin lives in its own repository: https://github.com/jayclrk358/Perfmon. The VPS installer downloads it from there. |

          Server binaries are attached when their builds finish (15 to 35 minutes after the release appears).
          Built for x86-64-v3 CPUs (AVX2, roughly 2015 or newer).
          Pumpkin commit \`$commit\` with these patches:
          $patches
          EOF
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc (2.35) keeps the binary compatible with Ubuntu 22.04+ and Debian 12+.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Pumpkin is pinned to one commit, so its compiled crates are reused across runs; only the
      # patched crates and the final link happen again.
      - name: Fetch Pumpkin source (for the cache key)
        shell: bash
        run: |
          commit=$(grep -oP "PUMPKIN_COMMIT:-\K[0-9a-f]+" build.sh)
          git clone --quiet --recurse-submodules https://github.com/Pumpkin-MC/Pumpkin.git Pumpkin
          git -C Pumpkin checkout --quiet "$commit" && git -C Pumpkin submodule update --init --recursive

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Pumpkin
          key: ${{ matrix.name }}

      # The server binary only depends on the pinned Pumpkin commit, the patches and the build
      # scripts. If none of those changed since a previous release, reuse that release's binary
      # instead of spending 15-35 minutes rebuilding it.
      - name: Reuse the previous server binary if its inputs are unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(cat build.sh build.ps1 patches/*.patch | sha256sum | cut -d' ' -f1)
          echo "BUILD_ID=$id" >> "$GITHUB_ENV"
          bin="pumpkin-${{ matrix.name }}"; [[ "$RUNNER_OS" == "Windows" ]] && bin="$bin.exe"
          for tag in $(gh release list --limit 10 --json tagName --jq '.[].tagName'); do
            prev=$(gh release download "$tag" --pattern pumpkin-build-id.txt --output - 2>/dev/null || true)
            if [[ "$prev" == "$id" ]] && gh release download "$tag" --pattern "$bin" --dir dl 2>/dev/null; then
              out=server/pumpkin; [[ "$RUNNER_OS" == "Windows" ]] && out="$out.exe"
              mv "dl/$bin" "$out" && chmod +x "$out"
              echo "REUSED=true" >> "$GITHUB_ENV"
              echo "Reusing the server binary from release $tag (build id $id)"
              break
            fi
          done
          grep -q REUSED "$GITHUB_ENV" || echo "No previous release with build id $id: building"

      # x86-64-v3 (AVX2, ~2015+ CPUs) is fast and runs on practically every server CPU.
      - name: Build (Linux)
        if: runner.os == 'Linux' && env.REUSED != 'true'
        run: ./build.sh --cpu x86-64-v3

      - name: Build (Windows)
        if: runner.os == 'Windows' && env.REUSED != 'true'
        shell: pwsh
        run: ./build.ps1 -Cpu x86-64-v3

      - name: Record the build id
        shell: bash
        run: mkdir -p dist && echo "$BUILD_ID" > dist/pumpkin-build-id.txt

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist bundle/Mineversed
          cp server/pumpkin "dist/pumpkin-${{ matrix.name }}"
          cp server/pumpkin server/pumpkin.toml server/start.sh server/pumpkin.service bundle/Mineversed/
          mkdir -p bundle/Mineversed/panel && cp panel/panel.py panel/panel.html panel/panel.service panel/README.md bundle/Mineversed/panel/
          chmod +x bundle/Mineversed/pumpkin bundle/Mineversed/start.sh
          tar -C bundle -czf "dist/Mineversed-${{ matrix.name }}.tar.gz" Mineversed

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, bundle/Mineversed | Out-Null
          Copy-Item server/pumpkin.exe "dist/pumpkin-${{ matrix.name }}.exe"
          Copy-Item server/pumpkin.exe, server/pumpkin.toml, server/start.bat bundle/Mineversed/
          New-Item -ItemType Directory -Force bundle/Mineversed/panel | Out-Null
          Copy-Item panel/panel.py, panel/panel.html, panel/README.md bundle/Mineversed/panel/
          Compress-Archive -Path bundle/Mineversed -DestinationPath "dist/Mineversed-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > "SHA256SUMS-${{ matrix.name }}" && cd ..
          # the build id is identical on both runners; uploading twice with --clobber is fine
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
