[package]
name = "perfmon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Pumpkin plugin: tick timing, lag spikes, entity counts and memory, with in-game commands and a CSV log"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the same Pumpkin commit as build.sh
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "d1190dc51edc3d4447780017e244f8bc882cb81a" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
