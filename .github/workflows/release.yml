# Builds ready-to-run server binaries and publishes them as a GitHub Release.
# Push a tag like v0.1.0 to make a release, or run it by hand from the Actions tab
# (a manual run only produces downloadable artifacts, no release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pumpkin plugin (WebAssembly) that lets other client versions join (see plugins/multiversion/README.md).
  multiversion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add wasm32-wasip2

      # Compiled dependencies are reused between runs; only changed crates rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/multiversion
          key: wasm32-wasip2

      - name: Test
        run: cargo test --release --manifest-path plugins/multiversion/Cargo.toml

      - name: Build multiversion.wasm
        run: ./plugins/multiversion/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: multiversion
          path: plugins/multiversion/target/wasm32-wasip2/release/multiversion.wasm
          if-no-files-found: error

      # Publish the release right away with the plugin; the server binaries are attached by the
      # build jobs as they finish (20-30 min later), so `mc update` can pick up the plugin early.
      - name: Create release with the plugin
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(grep -oP "PUMPKIN_COMMIT:-\K[0-9a-f]+" build.sh)
          mc=$(grep -oP 'MC_VERSION:-\K[0-9.]+' build.sh)
          patches=$(ls patches/*.patch | xargs -n1 basename | sed 's/^/- /')
          cat > notes.md <<EOF
          Ready-to-run server for **Minecraft Java $mc**. No Java or build tools needed.

          | File | For |
          |---|---|
          | \`pumpkin-linux-x86_64\` | Linux x86-64 (Ubuntu 22.04+, Debian 12+). Just the server binary. |
          | \`ServerJar-linux-x86_64.tar.gz\` | Linux: binary + tuned \`pumpkin.toml\` + \`start.sh\` + systemd unit + web panel + multiversion plugin. |
          | \`pumpkin-windows-x86_64.exe\` | Windows x86-64. Just the server binary. |
          | \`ServerJar-windows-x86_64.zip\` | Windows: exe + tuned \`pumpkin.toml\` + \`start.bat\`. |
          | \`multiversion.wasm\` | Pumpkin plugin that lets other client versions join (26.2 so far). Drop it into \`plugins/\`; on first start it writes the three pumpkin.toml settings it needs to \`plugins/data/multiversion/pumpkin-settings.txt\`. Also inside both bundles. |

          Server binaries are attached when their builds finish (about 30 minutes after the plugin).
          Built for x86-64-v3 CPUs (AVX2, roughly 2015 or newer).
          Pumpkin commit \`$commit\` with these patches:
          $patches
          EOF
          gh release create "$GITHUB_REF_NAME" plugins/multiversion/target/wasm32-wasip2/release/multiversion.wasm --title "$GITHUB_REF_NAME" --notes-file notes.md

  build:
    needs: multiversion
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc (2.35) keeps the binary compatible with Ubuntu 22.04+ and Debian 12+.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Pumpkin is pinned to one commit, so its compiled crates are reused across runs; only the
      # patched crates and the final link happen again.
      - name: Fetch Pumpkin source (for the cache key)
        shell: bash
        run: |
          commit=$(grep -oP "PUMPKIN_COMMIT:-\K[0-9a-f]+" build.sh)
          git clone --quiet --recurse-submodules https://github.com/Pumpkin-MC/Pumpkin.git Pumpkin
          git -C Pumpkin checkout --quiet "$commit" && git -C Pumpkin submodule update --init --recursive

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Pumpkin
          key: ${{ matrix.name }}

      - uses: actions/download-artifact@v4
        with:
          name: multiversion
          path: plugins/multiversion

      # x86-64-v3 (AVX2, ~2015+ CPUs) is fast and runs on practically every server CPU.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./build.sh --cpu x86-64-v3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Cpu x86-64-v3

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist bundle/ServerJar
          cp server/pumpkin "dist/pumpkin-${{ matrix.name }}"
          cp server/pumpkin server/pumpkin.toml server/start.sh server/pumpkin.service bundle/ServerJar/
          mkdir -p bundle/ServerJar/plugins/multiversion
          cp plugins/multiversion/multiversion.wasm plugins/multiversion/install.sh plugins/multiversion/README.md bundle/ServerJar/plugins/multiversion/
          mkdir -p bundle/ServerJar/panel && cp panel/panel.py panel/panel.html panel/panel.service panel/README.md bundle/ServerJar/panel/
          chmod +x bundle/ServerJar/pumpkin bundle/ServerJar/start.sh bundle/ServerJar/plugins/multiversion/install.sh
          tar -C bundle -czf "dist/ServerJar-${{ matrix.name }}.tar.gz" ServerJar

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, bundle/ServerJar | Out-Null
          Copy-Item server/pumpkin.exe "dist/pumpkin-${{ matrix.name }}.exe"
          Copy-Item server/pumpkin.exe, server/pumpkin.toml, server/start.bat bundle/ServerJar/
          New-Item -ItemType Directory -Force bundle/ServerJar/plugins/multiversion | Out-Null
          Copy-Item plugins/multiversion/multiversion.wasm, plugins/multiversion/README.md bundle/ServerJar/plugins/multiversion/
          New-Item -ItemType Directory -Force bundle/ServerJar/panel | Out-Null
          Copy-Item panel/panel.py, panel/panel.html, panel/README.md bundle/ServerJar/panel/
          Compress-Archive -Path bundle/ServerJar -DestinationPath "dist/ServerJar-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > "SHA256SUMS-${{ matrix.name }}" && cd ..
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
