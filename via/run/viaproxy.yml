# ViaProxy configuration for ServerJar. Players connect to ViaProxy (this port), which
# translates their protocol version and forwards them to Pumpkin on 127.0.0.1:25566.
# Full option list: ViaProxy writes missing keys with defaults (and comments) on first start.

# Public port players connect to (the one you open in the firewall).
bind-address: "0.0.0.0:25565"
# Where Pumpkin listens (setup.sh/setup.ps1 moves it to this localhost-only port).
target-address: "127.0.0.1:25566"
# Pumpkin's protocol version. If ViaProxy doesn't know this name it auto-detects by pinging Pumpkin.
target-version: "26.3"
# ViaProxy verifies players with Mojang itself (Pumpkin runs in offline mode on localhost).
# The PumpkinForward plugin then hands the verified UUID/skin/IP to Pumpkin.
proxy-online-mode: true
# No ViaProxy account is used for the backend: Pumpkin trusts the forwarded, signed profile instead.
auth-method: none
chat-signing: true
# Match Pumpkin's networking.java.compression.threshold.
compression-threshold: 512
connect-timeout: 8000
rewrite-handshake-packet: true
rewrite-transfer-packets: true
log-ips: true
log-client-status-requests: false
