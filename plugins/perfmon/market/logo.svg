<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2230"/>
      <stop offset="1" stop-color="#10131b"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5484d"/>
      <stop offset="0.5" stop-color="#f5b83d"/>
      <stop offset="1" stop-color="#3ecf8e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- gauge track and coloured arc -->
  <path d="M 116 330 A 152 152 0 1 1 396 330" fill="none" stroke="#2a3142" stroke-width="34" stroke-linecap="round"/>
  <path d="M 116 330 A 152 152 0 1 1 396 330" fill="none" stroke="url(#arc)" stroke-width="34" stroke-linecap="round"/>
  <!-- tick marks -->
  <g stroke="#10131b" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="98" x2="256" y2="132"/>
    <line x1="144" y1="144" x2="168" y2="168"/>
    <line x1="368" y1="144" x2="344" y2="168"/>
  </g>
  <!-- needle pointing to the healthy (green) side -->
  <line x1="256" y1="290" x2="352" y2="196" stroke="#f4f6fb" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="290" r="26" fill="#f4f6fb"/>
  <circle cx="256" cy="290" r="11" fill="#10131b"/>
  <!-- heartbeat line: the tick timeline with one spike -->
  <polyline points="72,410 168,410 196,410 220,360 248,452 276,384 300,410 440,410"
            fill="none" stroke="#ff6b2c" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
</svg>
